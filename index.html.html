<style>
:root{--bg:#0a0a0a;--side:#111;--side2:#1a1a1a;--border:#2a2a2a;--text:#ececec;--muted:#8a8a8a;--accent:#00d4aa;--user:#1f2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;overflow-x:hidden}
.sidebar{width:280px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;flex-shrink:0}
.side-top{display:flex;align-items:center;gap:12px;padding:6px 8px 14px}
.avatar{width:36px;height:36px;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;padding:2px}
.avatar img{width:100%;height:100%;object-fit:contain;display:block}
.logo-big{width:64px;height:64px;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;overflow:hidden}
.logo-big img{width:100%;height:100%;object-fit:contain;display:block}
.brand-name{font-weight:600;font-size:1.05rem}
.search-wrap{padding:0 4px 10px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--side2);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:.9rem}
.search-box span{color:var(--muted);font-size:.95rem}
.nav-btn{width:100%;text-align:left;padding:11px 12px;margin-bottom:4px;border:none;border-radius:10px;background:transparent;color:var(--text);font-size:.92rem;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav-btn:hover{background:var(--side2)}
.nav-btn.active{background:#1a2a28;color:var(--accent)}
.nav-btn .ic{width:20px;text-align:center;opacity:.9}
.section-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 8px 6px}
.projects{max-height:120px;overflow-y:auto;margin-bottom:4px}
.project-item{padding:9px 12px;border-radius:8px;font-size:.88rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px}
.project-item:hover{background:var(--side2);color:var(--text)}
.history{flex:1;overflow-y:auto;min-height:80px}
.history-item{padding:9px 12px;border-radius:8px;font-size:.88rem;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:2px}
.history-item:hover,.history-item.active{background:var(--side2);color:var(--text)}
.history-item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .del{opacity:0;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem}
.history-item:hover .del{opacity:1}
.side-bottom{border-top:1px solid var(--border);padding-top:10px;margin-top:8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:flex-end;padding:12px 18px;gap:10px}
.lang-select{background:var(--side2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:999px;font-size:.85rem;cursor:pointer}
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 16px;display:flex;flex-direction:column;align-items:center}
.chat-inner{width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px;overflow-x:hidden}
.welcome{text-align:center;margin:auto;padding:48px 16px}
.welcome .logo-big{width:64px;height:64px;margin:0 auto 16px}
.welcome h2{font-size:1.75rem;font-weight:500;margin-bottom:8px}
.welcome p{color:var(--muted)}
.message{width:100%;max-width:100%;line-height:1.55;font-size:.98rem;overflow-wrap:anywhere;word-break:break-word}
.message.user{align-self:flex-end;max-width:85%;background:var(--user);padding:12px 16px;border-radius:16px 16px 4px 16px;overflow-wrap:anywhere;word-break:break-word}
.message.ai .name{font-size:.8rem;color:var(--accent);margin-bottom:6px;font-weight:600;display:flex;align-items:center;gap:8px}
.message.ai .name .dot{width:18px;height:18px;border-radius:0!important;background:transparent!important}
.thinking{color:var(--muted);font-size:.9rem}
.math-box,.code-box{background:#141414;border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem;white-space:pre-wrap;overflow-x:auto}
.composer-wrap{width:100%;max-width:760px;margin:0 auto;padding:8px 16px 18px}
.composer{background:var(--side2);border:1px solid var(--border);border-radius:18px;padding:10px 12px;display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;background:transparent;border:none;color:var(--text);font-size:1rem;resize:none;outline:none;max-height:140px;line-height:1.45;font-family:inherit;padding:6px 4px}
.send-btn{width:36px;height:36px;border-radius:10px;border:none;background:var(--accent);color:#000;font-weight:700;cursor:pointer;font-size:1.1rem}
.tool-btn{background:none;border:none;color:var(--muted);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:1.1rem}
.tool-btn:hover{color:var(--text);background:#222}
.file-preview{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.file-chip{background:#1a1a1a;border:1px solid var(--border);padding:4px 10px;border-radius:999px;font-size:.8rem;display:flex;gap:6px;align-items:center}
.file-chip button{background:none;border:none;color:var(--muted);cursor:pointer}
.hint{text-align:center;font-size:.72rem;color:var(--muted);margin-top:8px}
.speak-btn{margin-top:8px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.speak-btn:hover{color:var(--accent);border-color:var(--accent)}
.speak-btn.playing{color:var(--accent);border-color:var(--accent)}

.nav-btn{justify-content:space-between}
.nav-btn{justify-content:space-between}
.nav-btn .chev{margin-left:auto;font-size:.75rem;color:var(--muted)}
.submenu{margin-bottom:6px;display:none}
.sub-btn{width:100%;text-align:left;padding:9px 12px 9px 40px;border:none;background:transparent;color:var(--muted);font-size:.86rem;cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:8px}
.sub-btn:hover{background:var(--side2);color:var(--text)}
.sub-btn.active{color:var(--accent);background:#1a2a28}
.projects,.history{scrollbar-width:none;-ms-overflow-style:none}
.projects::-webkit-scrollbar,.history::-webkit-scrollbar{display:none}

.sidebar{position:relative;transition:width .25s ease,margin .25s ease,padding .25s ease,opacity .25s}
.sidebar.collapsed{width:0;padding:0;margin:0;border:none;overflow:hidden;opacity:0;pointer-events:none}
.collapse-btn{position:absolute;top:14px;right:-14px;z-index:40;width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:#1a1a1a;color:#ececec;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.collapse-btn:hover{border-color:var(--accent);color:var(--accent)}
.collapse-btn.floating{position:fixed;left:12px;top:16px;right:auto;z-index:50;background:#1a1a1a}
.voice-box{margin:8px 4px 10px;padding:10px;background:var(--side2);border:1px solid var(--border);border-radius:10px}
.voice-box .vb-title{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.voice-opts{display:flex;gap:6px}
.voice-opt{flex:1;padding:8px 6px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:.82rem}
.voice-opt:hover{color:var(--text);border-color:#444}
.voice-opt.active{background:#1a2a28;color:var(--accent);border-color:var(--accent)}
@media(max-width:800px){.sidebar{display:none}.collapse-btn{display:none}}

.api-bar{padding:8px 16px 12px;border-top:1px solid var(--border);background:#0f0f0f;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:760px;margin:0 auto;width:100%}
.api-bar label{font-size:.8rem;color:var(--muted);white-space:nowrap}
.api-bar input{flex:1;min-width:160px;background:var(--side2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:.85rem;outline:none}
.api-bar button{background:var(--accent);color:#000;border:none;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:.85rem}
.api-bar .st{font-size:.75rem;color:var(--muted)}
.api-bar .st.on{color:var(--accent)}

.message.ai .name .dot{width:18px;height:18px;border-radius:0!important;background:transparent!important;display:inline-flex;align-items:center;justify-content:center;overflow:visible;flex-shrink:0;border:none;padding:0;margin:0}
.message.ai .name .dot img{width:18px;height:18px;object-fit:contain;display:block}
.message.ai .name .dot.thinking-spin img{animation:boltPulse .8s ease-in-out infinite}
@keyframes boltPulse{0%,100%{opacity:.5}50%{opacity:1}}
.msg-actions{display:flex;flex-wrap:wrap;gap:2px;margin-top:10px;align-items:center}
.msg-act{background:transparent;border:none;color:#8a8a8a;border-radius:999px;width:32px;height:32px;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.msg-act:hover{color:var(--text);background:#222}
.msg-act.on{color:var(--accent);background:#1a2a28}
.msg-act.dis.on{color:#f66;background:#2a1a1a}
.msg-act svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.send-btn:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">

function stripHtml(html){

function speakText(text, btn){
  if(!window.speechSynthesis){alert('Brauzer ovoz (TTS) ni qo‘llab-quvvatlamaydi');return}
  if(window.speechSynthesis.speaking){
    window.speechSynthesis.cancel();
    if(btn)btn.classList.remove('playing');
    return;
  }
  const u=new SpeechSynthesisUtterance(text);
  const langCode=SPEECH_LANG[currentLang]||'en-US';
  u.lang=langCode;
  u.rate=0.95;u.pitch=0.85;u.volume=1; // pastroq pitch = erkakroq
  const voices=window.speechSynthesis.getVoices();
  const want=(langCode||'en').slice(0,2).toLowerCase();
  const femaleRe=/female|woman|girl|zira|susan|samantha|karen|moira|tessa|veena|fiona|victoria|helen|hazel|linda|heather|catherine|anna|helena|alice|amelie|sara|melina|kyoko|yuna|google US English Female|microsoft.*(zira|susan)/i;
  const maleRe=/male|man|boy|david|mark|daniel|george|james|thomas|alex|fred|jorge|diego|paulo|raul|miguel|arthur|thomas|google US English Male|microsoft.*(david|mark|george)|ravi|sean|lee|bahasa/i;
  function score(v){
    let s=0;
    const name=(v.name||'')+' '+(v.voiceURI||'');
    const lang=(v.lang||'').toLowerCase();
    if(lang.indexOf(want)===0)s+=10;
    else if(lang.indexOf('en')===0)s+=3;
    if(voiceGender==='male'){
      if(maleRe.test(name))s+=12;
      if(femaleRe.test(name))s-=12;
      if(/male/i.test(name))s+=5;
      u.pitch=0.85;
    }else{
      if(femaleRe.test(name))s+=12;
      if(maleRe.test(name))s-=12;
      if(/female/i.test(name))s+=5;
      u.pitch=1.1;
    }
    return s;
  }
  let best=null,bestS=-999;
  voices.forEach(function(v){
    const sc=score(v);
    if(sc>bestS){bestS=sc;best=v}
  });
  if(best){u.voice=best;u.lang=best.lang||langCode}
  u.onstart=function(){if(btn)btn.classList.add('playing')};
  u.onend=function(){if(btn)btn.classList.remove('playing')};
  u.onerror=function(){if(btn)btn.classList.remove('playing')};
  window.speechSynthesis.speak(u);
}

};
function normalize(t){return t.toLowerCase().replace(/[ʼ‘’`']/g,"'").replace(/,/g,'.').replace(/\s+/g,' ').trim()}
function wordsToNumber(text){
  let t=normalize(text).replace(/(ni|ny|nı|ga|ka|ни|ны|га)$/,'');
  if(numMap[t]!==undefined)return numMap[t];
  const ns=t.replace(/\s/g,'');
  if(numMap[ns]!==undefined)return numMap[ns];
  const parts=t.split(' ');
  if(parts.length===2){
    let a=numMap[parts[0]],b=numMap[parts[1]];
    if(a===undefined)a=numMap[parts[0].replace(/(ni|ga|ka)$/,'')];
    if(b===undefined)b=numMap[parts[1].replace(/(ni|ga|ka)$/,'')];
    if(a!==undefined&&b!==undefined){
      if(a>=20&&a%10===0&&b<10)return a+b;
      if(a===10&&b<10)return a+b;
    }
  }
  if(/^\d+(\.\d+)?$/.test(t))return parseFloat(t);
  return null;
}
function extractNumbersAndOp(text){
  const t=normalize(text);
  let op=null;
  if(/kosh|qosh|qo'?sh|plus|\+|artı|добав|сложи/i.test(t))op='+';
  else if(/ayir|minus|\-|ayır|вычт/i.test(t))op='-';
  else if(/kopaytir|ko'?paytir|multiply|\*|×|умнож|çarp/i.test(t))op='*';
  else if(/bol|bo'?l|divide|÷|\/|раздел|böl/i.test(t))op='/';
  // Also split patterns like 2+2, 12*8
  const glued=t.match(/(-?\d+(?:\.\d+)?)\s*([\+\-\*\/×÷])\s*(-?\d+(?:\.\d+)?)/);
  if(glued){
    const o={'+':'+','-':'-','*':'*','×':'*','/':'/','÷':'/'}[glued[2]];
    return{a:parseFloat(glued[1]),b:parseFloat(glued[3]),op:o};
  }
  const tokens=t.split(/\s+/).filter(Boolean);
  const nums=[];
  for(let i=0;i<tokens.length;i++){
    let token=tokens[i];
    let clean=token.replace(/(ni|ny|nı|ga|ka)$/,'');
    let n=wordsToNumber(clean);
    if(n===null)n=wordsToNumber(token);
    if(n===null){
      for(const key of Object.keys(numMap)){
        if(key.length>=3&&(token.indexOf(key)===0||clean.indexOf(key)===0)){n=numMap[key];break}
      }
    }
    if(n!==null)nums.push(n);
  }
  if(nums.length>=2&&op)return{a:nums[0],b:nums[1],op:op};
  return null;
}
function safeCalc(expr){
  expr=String(expr).replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/\^/g,'**');
  if(!/^[\d\.\+\-\*\/\(\)\*]+$/.test(expr.replace(/\*\*/g,'')))return null;
  // simple recursive descent for + - * / and **
  try{
    let i=0;
    function peek(){return expr[i]}
    function eat(){return expr[i++]}
    function num(){
      let s='';
      if(peek()==='+'||peek()==='-')s+=eat();
      while(peek()&&/[\d\.]/.test(peek()))s+=eat();
      const n=parseFloat(s);
      if(isNaN(n))throw new Error('num');
      return n;
    }
    function factor(){
      if(peek()==='('){eat();const v=exprSum();if(peek()===')')eat();return v}
      return num();
    }
    function power(){
      let v=factor();
      while(expr.slice(i,i+2)==='**'){i+=2;v=Math.pow(v,factor())}
      return v;
    }
    function term(){
      let v=power();
      while(peek()==='*'||peek()==='/'){const o=eat();const r=power();v=o==='*'?v*r:v/r}
      return v;
    }
    function exprSum(){
      let v=term();
      while(peek()==='+'||peek()==='-'){const o=eat();const r=term();v=o==='+'?v+r:v-r}
      return v;
    }
    const r=exprSum();
    if(i!==expr.length)return null;
    return r;
  }catch(e){return null}
}
function trySolveMath(text){
  const original=text;
  const t=normalize(text).replace(/×/g,'*').replace(/÷/g,'/');
  const wc=extractNumbersAndOp(text);
  if(wc){
    let r=null;
    if(wc.op==='+')r=wc.a+wc.b;
    else if(wc.op==='-')r=wc.a-wc.b;
    else if(wc.op==='*')r=wc.a*wc.b;
    else if(wc.op==='/'&&wc.b)r=wc.a/wc.b;
    if(r!==null&&isFinite(r)){
      const s={'+':'+','-':'-','*':'×','/':'÷'}[wc.op];
      return '<strong>Math:</strong><br><div class="math-box">"'+escapeHtml(original)+'"\n\n'+wc.a+' '+s+' '+wc.b+' = <strong>'+(Math.round(r*1e6)/1e6)+'</strong></div>';
    }
  }
  const pure=t.replace(/\s+/g,'');
  if(/^[\d\.\+\-\*\/\^\(\)×÷]+$/.test(pure)||/sqrt|pi|π/.test(t)){
    let expr=pure.replace(/π|pi/g,'3.141592653589793');
    // sqrt(n)
    expr=expr.replace(/sqrt\(([^)]+)\)/g,function(_,x){const v=safeCalc(x);return v!==null?String(Math.sqrt(v)):_});
    const r=safeCalc(expr);
    if(r!==null&&isFinite(r))
      return '<strong>Math:</strong><br><div class="math-box">'+escapeHtml(original)+'\n\n= <strong>'+(Math.round(r*1e6)/1e6)+'</strong></div>';
  }
  const eq=t.match(/^([0-9\.\s\+\-\*xх]+)\s*=\s*([0-9\.\s\+\-]+)$/i);
  if(eq){
    try{
      let L=eq[1].replace(/x|х/gi,'x').replace(/\s+/g,''),R=parseFloat(eq[2].replace(/\s+/g,''));
      let a=0,b=0,m=L.match(/^([+-]?\d*\.?\d*)x([+-]\d+\.?\d*)$/);
      if(m){a=m[1]===''||m[1]==='+'?1:m[1]==='-'?-1:parseFloat(m[1]);b=parseFloat(m[2]);}
      else{m=L.match(/^x([+-]\d+\.?\d*)$/);if(m){a=1;b=parseFloat(m[1]);}
      else{m=L.match(/^([+-]?\d*\.?\d*)x$/);if(m){a=m[1]===''||m[1]==='+'?1:m[1]==='-'?-1:parseFloat(m[1]);}
      else if(L==='x')a=1;}}
      if(a){
        const x=(R-b)/a;
        return '<strong>Algebra:</strong><br><div class="math-box">'+escapeHtml(original)+'\n\n'+a+'x '+(b>=0?'+ '+b:'- '+Math.abs(b))+' = '+R+'\nx = <strong>'+(Math.round(x*1e6)/1e6)+'</strong></div>';
      }

function getCodeReply(text){
  const t=text.toLowerCase();
  if(/html\s*nima|what is html|html\s*это|html\s*nedir/i.test(t)||(t.includes('html')&&(/nima|what|это|nedir/.test(t))))
    return '<strong>HTML</strong><br><div class="code-box">&lt;!DOCTYPE html&gt;\n&lt;html&gt;\n&lt;body&gt;\n  &lt;h1&gt;Hello&lt;/h1&gt;\n&lt;/body&gt;\n&lt;/html&gt;</div>';
  if(/css\s*nima|what is css|css\s*nedir/i.test(t)||(t.includes('css')&&(/nima|what|nedir/.test(t))))
    return '<strong>CSS</strong><div class="code-box">body { background:#0a0a0a; color:#fff; }\n.btn { padding:10px 16px; border-radius:8px; }</div>';
  if(/javascript|js\s*nima|what is js/i.test(t)&&(/nima|what|это|nedir|kod|code/.test(t)||t==='javascript'||t==='js'))
    return '<strong>JavaScript</strong><div class="code-box">function hi(name){ return "Hello, "+name; }\nconsole.log(hi("Akrom"));</div>';
  if(/python/i.test(t)&&(/nima|what|kod|code|nedir|это/.test(t)||t.trim()==='python'))
    return '<strong>Python</strong><div class="code-box">def hi(name):\n    return f"Hello, {name}"\nprint(hi("Akrom"))</div>';
  if(/css\s*anim|animatsiya|keyframes|animation/i.test(t))
    return '<strong>CSS animation</strong><div class="code-box">@keyframes pulse {\n  50% { transform: scale(1.1); }\n}\n.box { animation: pulse 1s infinite; }</div>';
  if(/kod\s*yoz|code\s*example|script\s*yoz/i.test(t))

  return null;
}

const OS_NAMES={kali:'Kali Linux',macos:'macOS',windows:'Windows'};
function osDesc(entry){
  if(typeof entry==='string')return entry;
  return entry[currentLang]||entry.en||entry.uz;
}
function osIntro(os){
  const names=Object.keys(OS_CMDS[os]).map(function(k){return '<code>'+k+'</code>'}).join(', ');
  return (currentLang==='en'
    ?'<strong>'+OS_NAMES[os]+' mode</strong> is on. Ask about a command, e.g. "'+Object.keys(OS_CMDS[os])[0]+' nima?" Available: '
    :'<strong>'+OS_NAMES[os]+' rejimi</strong> yoqildi. Buyruq nomini yozing, masalan "'+Object.keys(OS_CMDS[os])[0]+' nima?" Mavjud buyruqlar: ')
    +names;
}
function getOSCodeReply(text){
  if(!currentOS)return null;
  const t=text.toLowerCase().trim();
  const dict=OS_CMDS[currentOS];
  for(const cmd in dict){
    const key=cmd.toLowerCase();
    if(t===key||t.indexOf(key+' ')===0||t.indexOf(' '+key)>=0||t.indexOf(key)===0){
      return '<strong>'+OS_NAMES[currentOS]+' — <code>'+cmd+'</code></strong><div class="code-box">'+osDesc(dict[cmd])+'</div>';
    }
  }
  return null;
}

function kbLookup(text){
  const t=String(text||'').toLowerCase().trim().replace(/[?!.,]+$/,'');
  if(!t)return null;
  if(AKROM_KB[t])return AKROM_KB[t];
  // partial: key contained in text or text in key
  for(const k in AKROM_KB){
    if(t===k||t.indexOf(k)>=0||k.indexOf(t)>=0){
      if(k.length>=3&&t.length>=3)return AKROM_KB[k];
    }
  }
  return null;
}
function getKnowledge(text){

  if(/qwen|lm\s*studio|netlify/i.test(t))return 'Qwen — AI model oilasi. LM Studio — lokal model ishlatish. Netlify — bepul hosting.';
  return null;
}

}

    if(files.length)display+=(text?'<br>':'')+files.map(function(f){return '📎 '+f.name}).join('<br>');
    addMessage(display||'📎',true);
    addToHistory(text||'File');
    userInput.value='';userInput.style.height='auto';
    const attached=files.slice();files=[];renderFilePreview();
    await showThinking(1);
    if(attached.length){
      addMessage('📎 '+attached.map(function(f){return f.name}).join(', '),false);
    }else{
      var reply='';
      try{
        reply=getQuickFacts(text)||trySolveMath(text)||getOSCodeReply(text)||getCodeReply(text)||kbLookup(text)||generateReply(text)||'…';
      }catch(e){
        reply='Error: '+String(e.message||e);
      }
      addMessage(reply,false);
    }
  }catch(err){
    try{addMessage('Error: '+escapeHtml(String(err.message||err)),false)}catch(e){}
  }finally{
    window.__akromBusy=false;
    if(sendBtn)sendBtn.disabled=false;
  }
}


(function initSidebarUI(){
  const sidebar=document.getElementById('sidebar');
  const collapseBtn=document.getElementById('collapseBtn');
  const voiceMale=document.getElementById('voiceMale');
  const voiceAra=document.getElementById('voiceAra');
  function syncVoiceUI(){
    if(voiceMale)voiceMale.classList.toggle('active',voiceGender==='male');
    if(voiceAra)voiceAra.classList.toggle('active',voiceGender==='ara');
  }
  if(voiceGender==='female')voiceGender='ara';
  syncVoiceUI();
  if(voiceMale)voiceMale.onclick=function(){voiceGender='male';safeSet('akrom_voice','male');syncVoiceUI()};
  if(voiceAra)voiceAra.onclick=function(){voiceGender='ara';safeSet('akrom_voice','ara');syncVoiceUI()};
  if(collapseBtn&&sidebar){
    function syncCollapse(){
      sidebar.classList.toggle('collapsed',sidebarCollapsed);
      if(sidebarCollapsed){
        collapseBtn.textContent='»';
        collapseBtn.classList.add('floating');
        collapseBtn.title='Open menu';
        // move button to body so it stays visible when sidebar width=0
        if(collapseBtn.parentElement!==document.body)document.body.appendChild(collapseBtn);
      }else{
        collapseBtn.textContent='«';
        collapseBtn.classList.remove('floating');
        collapseBtn.title='Close menu';
        if(sidebar && collapseBtn.parentElement!==sidebar)sidebar.insertBefore(collapseBtn,sidebar.firstChild);
      }
    }
    collapseBtn.onclick=function(){
      sidebarCollapsed=!sidebarCollapsed;
      syncCollapse();
    };
    syncCollapse();
  }
})();


applyLang();startNewChat();
